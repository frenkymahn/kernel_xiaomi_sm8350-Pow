name: Build Kernel - Next-Gen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Download mkdtboimg tool
        run: |
          wget -q https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/main/utils.tar.gz
          tar -xf utils.tar.gz
          chmod +x mkdtboimg.py
          sudo cp mkdtboimg.py /usr/local/bin/

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Merge base defconfig with Xiaomi and Vili config fragments
          make O=out CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-qgki_defconfig vendor/xiaomi_QGKI.config vendor/vili_QGKI.config

          # 1. Set custom LocalVersion string
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Next-Gen"

          # 2. KernelSU and OverlayFS support options
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e TMPFS_XATTR

          # 3. MIUI / HyperOS and AOSP boot compatibility options
          ./scripts/config --file out/.config -e CONFIG_MI_MEMORY_OPT
          ./scripts/config --file out/.config -e CONFIG_XIAOMI_MIUI
          ./scripts/config --file out/.config -e CONFIG_RESTRICT_ROOT
          ./scripts/config --file out/.config -e CONFIG_BOARD_USES_MIUI_BOOSTER
          ./scripts/config --file out/.config -e CONFIG_PROCESS_RECLAIM
          ./scripts/config --file out/.config -e CONFIG_ZRAM
          ./scripts/config --file out/.config -e CONFIG_ZSMALLOC
          ./scripts/config --file out/.config -e CONFIG_PSI
          ./scripts/config --file out/.config -d CONFIG_SECURITY_DEFEX
          ./scripts/config --file out/.config -d CONFIG_INTEGRITY_SIGNATURE

          # Ensure the configuration is valid
          make O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Compile Kernel Image and Device Tree Blobs (dtbs)
          make -j$(nproc --all) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbs

          # Generate dtbo.img using mkdtboimg.py
          find out/arch/arm64/boot/dts -name "*dtbo.dtb" -o -name "*dtbo.img" > dtbo_list.txt || true
          if [ -s dtbo_list.txt ]; then
            python3 mkdtboimg.py create out/arch/arm64/boot/dtbo.img $(cat dtbo_list.txt)
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3

          # Disable device assertion check
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

          # Copy kernel Image
          cp ../out/arch/arm64/boot/Image .

          # Combine and copy dtb
          find ../out/arch/arm64/boot/dts/vendor/qcom -name "*.dtb" ! -name "*dtbo*" -exec cat {} + > dtb || true
          if [ ! -s dtb ]; then
            find ../out/arch/arm64/boot -name "*.dtb" ! -name "*dtbo*" -exec cat {} + > dtb || true
          fi

          # Copy dtbo.img
          find ../out/arch/arm64/boot -name "dtbo.img" -exec cp {} . \; || true

          # Create flashable zip package
          zip -r9 ../kernel-flashable-Next-Gen.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Next-Gen
          path: kernel-flashable-Next-Gen.zip
