name: Build Kernel - Next-Gen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Spanish-or-Vanish/kernel_xiaomi_sm8350
          ref: vili_ksu-302
          submodules: recursive
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Load defconfig
          make O=out CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-gki_defconfig

          # 1. Set LocalVersion
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Next-Gen"

          # 2. KernelSU & OverlayFS support
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e TMPFS_XATTR

          # 3. MIUI / HyperOS & AOSP boot options
          ./scripts/config --file out/.config -e CONFIG_MI_MEMORY_OPT
          ./scripts/config --file out/.config -e CONFIG_XIAOMI_MIUI
          ./scripts/config --file out/.config -e CONFIG_RESTRICT_ROOT
          ./scripts/config --file out/.config -e CONFIG_BOARD_USES_MIUI_BOOSTER
          ./scripts/config --file out/.config -e CONFIG_PROCESS_RECLAIM
          ./scripts/config --file out/.config -e CONFIG_ZRAM
          ./scripts/config --file out/.config -e CONFIG_ZSMALLOC
          ./scripts/config --file out/.config -e CONFIG_PSI
          ./scripts/config --file out/.config -d CONFIG_SECURITY_DEFEX
          ./scripts/config --file out/.config -d CONFIG_INTEGRITY_SIGNATURE

          # Apply config changes
          make O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Compile kernel
          make -j$(nproc --all) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3

          # Disable device check in AnyKernel script
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh

          # Copy built images
          cp ../out/arch/arm64/boot/Image .
          [ -f ../out/arch/arm64/boot/dtb ] && cp ../out/arch/arm64/boot/dtb . || true
          [ -f ../out/arch/arm64/boot/dtbo.img ] && cp ../out/arch/arm64/boot/dtbo.img . || true

          # Create flashable zip
          zip -r9 ../kernel-flashable-Next-Gen.zip * -x .git README.md *placeholder
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Next-Gen
          path: kernel-flashable-Next-Gen.zip
